services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cisobrief}
      POSTGRES_USER: ${POSTGRES_USER:-cisobrief}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cisobrief} -d ${POSTGRES_DB:-cisobrief}"]
      interval: 5s
      timeout: 5s
      retries: 15
    ports:
      - "127.0.0.1:5432:5432"   # localhost only (DB tools on this PC); not exposed to the LAN

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    # No published port: only the app containers need Redis.

  web:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles   # collectstatic writes here; nginx serves it
      - media_data:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    command: ["sh", "-c", "/usr/local/bin/cisobrief-entrypoint.sh web"]

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "/usr/local/bin/cisobrief-entrypoint.sh worker"]

  beat:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "/usr/local/bin/cisobrief-entrypoint.sh beat"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/static:ro
      - media_data:/media:ro
    ports:
      - "127.0.0.1:80:80"

  # ---- Optional free local AI (start with: docker compose --profile local-ai up -d) ----
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: "16384"   # default is too small for a full brief prompt
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama_data:/root/.ollama
    # NVIDIA GPU (much faster). Needs the NVIDIA Container Toolkit / Docker Desktop GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-pull:   # one-shot: downloads AI_MODEL into the ollama container on first start
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    depends_on: [ollama]
    env_file: [./.env]
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["sh", "-c", "sleep 3; ollama pull \"$${AI_MODEL:-qwen2.5:7b}\""]
    restart: "no"

  # Dev-only SMTP inbox (view mail at http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_WEBROOT: /
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  ollama_data:
  postgres_data:
  redis_data:
  static_data:
  media_data:
