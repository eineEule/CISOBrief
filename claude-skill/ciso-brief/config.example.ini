# =============================================================================
#  CISO Brief: your settings
#  Copy this file to config.ini (same folder) and fill it in.
#  Lines starting with # are comments. Blank values are fine; that part is skipped.
#  Keep config.ini private: it can hold API keys and an email password.
# =============================================================================

[profile]
# Your company. Names and domains are watched on leak sites, lookalike certificates,
# infostealer data and threat reports.
company = Example Corp
other_names =
domains = example.com
# One or more, comma-separated. Built-in industries: Construction, Manufacturing / Industrial,
# Energy & Utilities, Water & Wastewater, Healthcare, Financial Services, Government, Education,
# Retail, Transportation & Logistics, Technology / SaaS, Defense (anything else is used as a keyword).
industries = Technology / SaaS
# executive = plain-language business risk for leaders and the board
# technical = CVEs, products, EPSS, patch and detection steps for the SOC
audience = executive
brief_name = Daily Threat Brief

[technology]
# The technology you run, one per line. Built-in names (match many product terms):
#   Microsoft, Cisco, Fortinet, Palo Alto Networks, Ivanti, Citrix / NetScaler, VMware / Broadcom,
#   Okta, Google, Apple, AWS, Oracle, SAP, Atlassian, SonicWall, Juniper, Veeam, ConnectWise,
#   Linux / Open source, Procore, Autodesk, Trimble, Bentley Systems, Siemens (ICS),
#   Rockwell (ICS), Schneider Electric (ICS)
# Anything else: write "Name = term1, term2" (terms are matched as whole words).
Microsoft
Okta
Fortinet

[suppliers]
# Key suppliers and partners: Name = domain
# Example:
# Procore = procore.com

[keywords]
# Extra words or threat actors to flag, one per line.
# scattered spider

[brief]
# How far back each brief looks: 1 for a daily brief, 7 for a weekly one.
lookback_days = 1
# Sections, in order: summary, early_warning, actions, themes, attacks, kev, vendors, items
sections = summary, early_warning, actions, themes, attacks, vendors, items
# Include unmatched news only at or above this risk score (0-95).
min_risk = 50
max_items = 10
exploited_only = no

[sources]
# Turn sources on or off. Sources that need a key (below) are skipped while their key is blank.
kev = on
cisa_news = on
hacker_news = on
ransomlook = on
crtsh = on
hudsonrock = on
nvd_epss = on
mitre_attack = on
otx = on
urlhaus = on

[keys]
# All optional and free. Leave blank to skip that source.
# You can instead set environment variables (they win over this file):
#   CISO_BRIEF_OTX_API_KEY, CISO_BRIEF_ABUSECH_AUTH_KEY, CISO_BRIEF_NVD_API_KEY
#
# AlienVault OTX: community threat reports naming you, your suppliers or your industry.
#   Get it: https://otx.alienvault.com -> sign up -> Settings -> OTX Key
otx_api_key =
# abuse.ch URLhaus: malware being served from your or a supplier's domain.
#   Get it: https://auth.abuse.ch/ -> sign in -> Save profile -> Optional -> generate Auth-Key
abusech_auth_key =
# NVD: works without a key, just ~10x slower for vendor CVE checks.
#   Get it: https://nvd.nist.gov/developers/request-an-api-key
nvd_api_key =

[delivery]
# chat  = show the brief in the conversation (and save brief.html)
# file  = save brief.html / brief.md only
# email = also email it (set method below)
mode = chat
# Only used when mode = email:
#   connector = use Claude's Gmail or Outlook connector
#   smtp      = send directly via the [smtp] settings below (needs a terminal with internet)
email_method = connector
# connector only: draft (safer; you press send) or send
connector_action = draft
# Comma-separated. Leave blank to send to yourself (connector) / the smtp username.
recipients =

[smtp]
# Only used when mode = email and email_method = smtp.
# Gmail: host smtp.gmail.com, port 587, use_tls yes, and an App Password
#   (https://myaccount.google.com/apppasswords).
host =
port = 587
use_tls = yes
use_ssl = no
username =
# Better: leave blank and set the CISO_BRIEF_SMTP_PASSWORD environment variable.
password =
from =
