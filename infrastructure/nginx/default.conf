server {
  listen 80;

  client_max_body_size 10m;

  # Docker DNS resolver
  resolver 127.0.0.11 ipv6=off valid=10s;

  location /static/ {
    alias /static/;
    access_log off;
    expires 7d;
  }

  location /media/ {
    alias /media/;
    access_log off;
    expires 7d;
  }

  location / {
    # Force runtime DNS resolution (prevents startup crash)
    set $upstream http://web:8000;
    proxy_pass $upstream;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 300s;   # slow local AI models in "Run AI preview"
  }
}
